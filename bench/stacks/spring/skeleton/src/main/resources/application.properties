server.port=8080
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bench}
spring.datasource.username=${DB_USER:bench}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10
# Runs src/main/resources/schema.sql on every start, if the file exists.
spring.sql.init.mode=always
