<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="Cover: a cute kitten with a robotic arm holds a blue piece. OpenFabric. Del fracaso se aprende, del éxito no mucho.">
  <style>
    text{font-family:"IBM Plex Mono",Consolas,monospace;fill:#9aa5b1}
    .ln{stroke:#e4e7ea;stroke-width:11;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .soft{stroke:#9aa5b1;stroke-width:6;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .fur{fill:#2a3644}
    .ink{fill:#e4e7ea}
  </style>
  <!-- background -->
  <rect width="1920" height="1080" fill="#12171d"/>
  <!-- yellow offset block and plate -->
  <rect x="94" y="94" width="1760" height="940" fill="#f0b72a"/>
  <rect x="80" y="80" width="1760" height="940" fill="#19212a" stroke="#f0b72a" stroke-width="3"/>
  <!-- everything inside the plate, moved up to fill the space of the removed header -->
  <g transform="translate(0,-40)">
  <!-- cat with robotic arm (same drawing as logo.svg, static, scaled) -->
  <g transform="translate(20,2) scale(2)">
    <!-- floor -->
    <line x1="60" y1="442" x2="452" y2="442" class="soft"/>

    <!-- tail: cable with yellow plug (sways) -->
    <g>
      <path d="M154 424 C78 430 56 366 92 330" class="soft" stroke-width="9"/>
      <rect x="80" y="304" width="24" height="30" rx="7" fill="#f0b72a" transform="rotate(35 92 320)"/>
      <path d="M86 306 l-4 -9 M99 300 l4 -9" class="ln" stroke-width="5" transform="rotate(35 92 320)"/>
    </g>

    <!-- body -->
    <path d="M150 442 C146 360 172 322 212 322 C252 322 278 360 274 442 Z" class="ln fur"/>
    <path d="M172 442 V412" class="soft" stroke-width="5"/>
    <circle cx="238" cy="388" r="10" fill="#5cc185"/>
    <circle cx="238" cy="388" r="10" fill="#5cc185" fill-opacity="0"/>

    <!-- arm (lifts): shoulder, upper arm, elbow, forearm, wrist, gripper, piece -->
    <g>
      <path d="M272 384 L342 366" class="ln" stroke-width="20"/>
      <g>
        <path d="M342 366 L388 304" class="ln" stroke-width="20"/>
        <!-- gripper: two fingers around the piece -->
        <path d="M364 292 H414 M364 292 V244 M414 292 V244" class="ln" stroke-width="10"/>
        <rect x="371" y="248" width="36" height="36" rx="5" fill="#6f9be0"/>
        <circle cx="388" cy="304" r="10" class="ink"/>
      </g>
      <circle cx="342" cy="366" r="12" class="ink"/>
      <circle cx="272" cy="384" r="14" class="ink"/>
    </g>

    <!-- head: ears behind, then the big round head -->
    <path d="M108 210 Q88 98 124 82 Q158 78 200 122" class="ln fur"/>
    <path d="M314 210 Q334 98 298 82 Q264 78 222 122" class="ln fur"/>
    <path d="M118 172 Q112 118 128 106 Q148 108 176 132 Z" class="soft" stroke-width="5" fill="#e4a25a" fill-opacity=".35"/>
    <path d="M304 172 Q310 118 294 106 Q274 108 246 132 Z" class="soft" stroke-width="5" fill="#e4a25a" fill-opacity=".35"/>
    <ellipse cx="211" cy="214" rx="124" ry="98" class="ln fur"/>

    <!-- face -->
    <g>
      <ellipse cx="164" cy="220" rx="21" ry="25" fill="#12171d"/>
      <circle cx="171" cy="210" r="7" class="ink"/>
      <circle cx="158" cy="229" r="3.5" class="ink"/>
    </g>
    <g>
      <ellipse cx="258" cy="220" rx="21" ry="25" fill="#12171d"/>
      <circle cx="265" cy="210" r="7" class="ink"/>
      <circle cx="252" cy="229" r="3.5" class="ink"/>
    </g>
    <ellipse cx="124" cy="252" rx="14" ry="8" fill="#e8735e" fill-opacity=".5"/>
    <ellipse cx="298" cy="252" rx="14" ry="8" fill="#e8735e" fill-opacity=".5"/>
    <path d="M203 246 H219 L211 256 Z" fill="#e4a25a" stroke="#e4a25a" stroke-width="4" stroke-linejoin="round"/>
    <path d="M211 256 V261 M211 261 q-6 9 -16 2 M211 261 q6 9 16 2" class="ln" stroke-width="3.5"/>
    <path d="M96 232 L72 224 M98 248 L72 252 M326 232 L350 224 M324 248 L350 252" class="soft" stroke-width="4.5"/>  </g>
  <!-- wordmark -->
  <text x="1000" y="320" style="font-size:104px;font-weight:700;fill:#e4e7ea">OpenFabric</text>
  <rect x="1004" y="352" width="200" height="8" fill="#f0b72a"/>
  <!-- headline -->
  <text style="font-size:84px;font-weight:700;fill:#e4e7ea">
    <tspan x="1000" y="505">Del fracaso</tspan>
    <tspan x="1000" y="601">se aprende,</tspan>
    <tspan x="1000" y="697" style="fill:#f0b72a">del éxito</tspan>
    <tspan x="1000" y="793" style="fill:#f0b72a">no mucho.</tspan>
  </text>
  <!-- subline -->
  <text x="1000" y="945" style="font-size:38px">una línea de ensamblaje para la IA</text>
  </g>
</svg>
